<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <button onclick="addPoint()">+1</button>
            <button onclick="reset()">Reset</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <button onclick="draw()">Losuj</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <iframe src="https://www.autodraw.com" width="100%" height="400"
            style="border:0; border-radius: 8%;">
            </iframe>
        </div>
        <div class="card">
            <h2>Wideo</h2>
           <iframe src="https://youtu.be/SxMJrDeZLM8?si=ZlB5pEhAFABHG9eW" width="100%" height="400"
            style="border:0; border-radius: 8%;">
            </iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
