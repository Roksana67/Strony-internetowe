<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ranking telefonów 2026</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Ranking telefonów 2026</h1>
		<nav>
			<ul>
				<li><a href="#ranking">Ranking</a></li>
				<li><a href="#intro">O rankingu</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section id="intro">
			<h2>Najlepsze smartfony roku</h2>
			<p>Zobacz, które modele zdobyły najwięcej 
				punktów w rankingu</p>
		</section>
		<section id="ranking" class="ranking-grid">
			<article class="phone-card">
				<img src="images/telefon3.png" alt="iPhon 13">
				<h3>1.Iphon 12</h3>
				<p>Fajne gry xdddddddd</p>
				<span class="score">10/10</span>
			</article>
				<article class="phone-card">
				<img src="images/telefon1.png" alt="iPhon 13">
				<h3>2.Iphon 13</h3>
				<p>Fajny aparat</p>
				<span class="score">9.5/10</span>
			</article>
				<article class="phone-card">
				<img src="images/telefon2.png" alt="iPhon 13">
				<h3>3.Iphon 14</h3>
				<p>Za drogi</p>
				<span class="score">8.5/10</span>
			</article>
		</section>
	</main>

	<footer>
		<p>Ranking telefonów 2026</p>
	</footer>
</body>
</html>
